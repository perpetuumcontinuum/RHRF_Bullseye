<div class="rf-theme-switch" role="group" aria-label="Theme">
  <button type="button" data-set="light" title="Light" aria-pressed="false"><span class="sw sw-light"></span></button>
  <button type="button" data-set="dark" title="Dark" aria-pressed="false"><span class="sw sw-dark"></span></button>
  <button type="button" data-set="cyber" title="Cyber" aria-pressed="false">
    <svg viewBox="0 0 64 64" width="18" height="18" aria-hidden="true" focusable="false">
      <defs>
        <filter id="rfCyberGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect width="64" height="64" rx="14" fill="#12002b"/>
      <g filter="url(#rfCyberGlow)" fill="none" stroke-linecap="round">
        <circle cx="24" cy="25" r="4.5" fill="#00eaff"/>
        <circle cx="38" cy="25" r="4.5" fill="#00eaff"/>
        <path d="M19 39q13 12 26 0" stroke="#ff2bd6" stroke-width="6"/>
        <path d="m18 48 28-32" stroke="#fff" stroke-width="8"/>
        <path d="M54 7v12L42 9z" fill="#cf0"/>
      </g>
    </svg>
  </button>
</div>
