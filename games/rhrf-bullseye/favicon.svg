<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0014"/>
  
  <!-- Target rings -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#aa00ff" stroke-width="2" opacity="0.5"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  
  <!-- Bullseye center -->
  <circle cx="32" cy="32" r="4" fill="#ccff00"/>
  
  <!-- Arrow -->
  <path d="M44 20 L32 32 L20 44" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <polygon points="44,20 48,16 44,12" fill="#ff00ff"/>
  
  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Apply glow to bullseye -->
  <circle cx="32" cy="32" r="4" fill="#ccff00" filter="url(#glow)"/>
</svg>
