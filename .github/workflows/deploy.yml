name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build
      - name: Inject head assets
        run: |
          python3 - <<'EOF'
          import glob, shutil
          src = "games/rhrf-bullseye"
          out = src + "/.friendsdk"
          for f in ("favicon.svg", "site.webmanifest"):
              shutil.copy(src + "/" + f, out + "/" + f)
          inject = (
              '<meta name="description" content="Defend the planet with your Generations NFT in this cyber archery minigame. Shoot moving targets, dodge ghosts, deflect asteroids and unlock legendary gear. Built on FriendSDK v0.1.4."/>'
              '<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>'
              '<link rel="apple-touch-icon" href="./favicon.svg"/>'
              '<link rel="manifest" href="./site.webmanifest"/>'
          )
          for h in sorted(glob.glob(out + "/*.html")):
              t = open(h, encoding="utf-8").read()
              if "favicon.svg" in t:
                  continue
              t = t.replace("</head>", inject + "</head>", 1)
              open(h, "w", encoding="utf-8").write(t)
              print("injected", h)
          EOF

      - name: Generate OG image
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1200 -h 630 games/rhrf-bullseye/og-banner.svg -o games/rhrf-bullseye/.friendsdk/og.png
          python3 - <<'EOF'
          import glob
          out = "games/rhrf-bullseye/.friendsdk"
          base = "https://perpetuumcontinuum.github.io/RHRF_Bullseye"
          og = (
            '<meta property="og:type" content="website"/>'
            '<meta property="og:site_name" content="RHRF Bullseye"/>'
            '<meta property="og:title" content="RHRF Bullseye — Cyber Archery for Rare Friends"/>'
            '<meta property="og:description" content="Your Generations NFT becomes the archer. Shoot moving targets, dodge ghosts, deflect asteroids and unlock legendary gear. Built on FriendSDK v0.1.4, live on Robinhood Chain."/>'
            '<meta property="og:url" content="' + base + '/"/>'
            '<meta property="og:image" content="' + base + '/og.png"/>'
            '<meta property="og:image:type" content="image/png"/>'
            '<meta property="og:image:width" content="1200"/>'
            '<meta property="og:image:height" content="630"/>'
            '<meta name="twitter:card" content="summary_large_image"/>'
            '<meta name="twitter:title" content="RHRF Bullseye — Cyber Archery for Rare Friends"/>'
            '<meta name="twitter:description" content="Cyber archery minigame for the Rare Friends Vibeathon. Simulated RF, Robinhood Chain, FriendSDK v0.1.4."/>'
            '<meta name="twitter:image" content="' + base + '/og.png"/>'
          )
          for h in sorted(glob.glob(out + "/*.html")):
              t = open(h, encoding="utf-8").read()
              if "og:image" in t:
                  continue
              t = t.replace("</head>", og + "</head>", 1)
              open(h, "w", encoding="utf-8").write(t)
              print("og injected", h)
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: games/rhrf-bullseye/.friendsdk

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
