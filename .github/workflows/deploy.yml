name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build
      - name: Apply page frame styles
        run: |
          cat >> games/rhrf-bullseye/.friendsdk/layout.css <<'CSS'
          :root{--pg:#0b0714;--fb:transparent;--bd:#b026ff;--g1:rgba(176,38,255,.5);--g2:rgba(0,229,255,.22);--gi:rgba(176,38,255,.14);--cbg:#16002e;--cfg:#e6fbff;--chv:#2a0a4a;--mf:#9a7ab5;--sbg:#12002b;--sf:#9a7ab5;--sc:rgba(5,0,15,.82);--mbg:#12002b;--mf2:#e6fbff;--ln:#3a1a55;--pb:#b026ff;--pf:#fff;--ic:#cf0}
          [data-theme=light]{--pg:#efe9f7;--bd:#7a1fd0;--g1:rgba(122,31,208,.28);--g2:rgba(0,150,200,.14);--gi:rgba(122,31,208,.08);--cbg:#fff;--cfg:#1a0f2b;--chv:#e6dcf2;--mf:#6b5a80;--sbg:#e8e0f0;--sf:#6b5a80;--sc:rgba(240,235,247,.86);--mbg:#fff;--mf2:#1a0f2b;--ln:#cbbfe0;--pb:#7a1fd0;--ic:#7a8f00}
          [data-theme=cyber]{--pg:#05000f;--bd:var(--cyber-fill);--g1:color-mix(in srgb,var(--cyber-fill) 55%,transparent);--g2:color-mix(in srgb,var(--cyber-fill) 35%,transparent);--gi:color-mix(in srgb,var(--cyber-fill) 20%,transparent);--cbg:#12002b;--cfg:#e6fbff;--chv:#2a0a4a;--mf:var(--cyber-fill);--sbg:#0a0020;--sf:var(--cyber-fill);--sc:rgba(3,0,12,.85);--mbg:#0a0020;--mf2:#e6fbff;--ln:#00384a;--pb:var(--cyber-fill);--pf:#05000f;--ic:var(--cyber-fill);animation:friendCyberFill 3.2s linear infinite}
          html,body{background:var(--pg)}
          body{margin:0;padding:0;min-height:100dvh;display:flex;align-items:center;justify-content:center}
          [data-theme=cyber] body{background:linear-gradient(115deg,#12002b,#3d005e,#001a3d,#003d2e,#3d0018,#12002b);background-size:400% 400%;animation:rfFlow 18s ease-in-out infinite}
          @keyframes rfFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
          @media (prefers-reduced-motion:reduce){[data-theme=cyber] body{animation:none}[data-theme=cyber]{animation:none}}
          #root{width:min(96vw,960px,calc((100dvh - var(--rf-reserve,99px)) * var(--rf-ar,1.5)));margin:0}
          section.rf-game-frame{background:var(--fb);border:1px solid var(--bd);border-radius:12px;box-shadow:0 0 26px var(--g1),0 0 70px var(--g2),inset 0 0 34px var(--gi)}
          section.rf-game-frame .rf-frame-toolbar>*,section.rf-game-frame button,section.rf-frame-scrim button{background:var(--cbg);border:1px solid var(--bd);color:var(--cfg)}
          section.rf-game-frame button:hover:not(:disabled),section.rf-frame-scrim button:hover:not(:disabled){background:var(--chv)}
          section.rf-game-frame .rf-frame-mode{color:var(--mf)}
          section.rf-game-frame .rf-runtime-status{background:var(--sbg);color:var(--sf)}
          section.rf-frame-scrim{background:var(--sc)}
          section.rf-frame-scrim .rf-frame-menu{background:var(--mbg);border-color:var(--bd);color:var(--mf2)}
          section.rf-frame-scrim .rf-frame-menu-heading,section.rf-frame-scrim .rf-frame-menu-footer{border-color:var(--ln)}
          section.rf-frame-scrim .rf-frame-friends button[aria-pressed=true]{background:var(--chv)}
          section.rf-game-frame .rf-frame-primary,section.rf-frame-scrim .rf-frame-primary{background:var(--pb);color:var(--pf)}
          .rf-theme-switch{position:fixed;top:12px;right:12px;z-index:50;display:flex;gap:6px;padding:5px;background:var(--cbg);border:1px solid var(--ln);border-radius:10px}
          .rf-theme-switch button{display:grid;place-items:center;width:28px;height:28px;min-height:0;padding:0;background:transparent;border:1px solid transparent;border-radius:7px;cursor:pointer}
          .rf-theme-switch button:hover{border-color:var(--bd)}
          .rf-theme-switch button[aria-pressed=true]{border-color:var(--bd);box-shadow:0 0 10px var(--g1)}
          .sw{display:block;width:18px;height:18px;border-radius:3px;border:1px solid rgba(127,127,127,.55)}
          .sw-light{background:#fff}
          .sw-dark{background:#111}
          @property --cyber-fill{syntax:"<color>";inherits:true;initial-value:#ccff00}
          @keyframes friendCyberFill{0%{--cyber-fill:#ccff00}12%{--cyber-fill:#7dff2a}25%{--cyber-fill:#aa00ff}37%{--cyber-fill:#ff00c8}50%{--cyber-fill:#00ffff}62%{--cyber-fill:#00a0ff}75%{--cyber-fill:#ffaa00}87%{--cyber-fill:#ff5e00}100%{--cyber-fill:#ccff00}}
          .rf-tools-toggle{position:absolute;left:14px;bottom:14px;z-index:4;display:grid;place-items:center;width:36px;height:36px;min-height:0;padding:0;background:var(--cbg);border:1px solid var(--bd);border-radius:9px;color:var(--cfg);cursor:pointer}
          .rf-tools-toggle:hover{background:var(--chv)}
          html:not(.rf-tools-open) .rf-frame-toolbar{display:none}
          html.rf-tools-open .rf-frame-toolbar{display:flex;bottom:58px}
          @media(max-width:520px){.rf-tools-toggle{left:6px;bottom:6px;width:32px;height:32px}html.rf-tools-open .rf-frame-toolbar{bottom:44px}}
          .rf-site-footer{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;padding:7px 16px;background:var(--cbg);border:1px solid var(--ln);border-radius:999px;box-shadow:0 0 18px var(--g1);font:11px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;max-width:94vw}
          .rf-site-footer a{display:flex;align-items:center;gap:6px;color:var(--mf);text-decoration:none;border-bottom:1px solid transparent;transition:color .18s,border-color .18s,text-shadow .18s}
          .rf-site-footer a:hover,.rf-site-footer a:focus-visible{color:var(--cfg);border-bottom-color:var(--bd);text-shadow:0 0 10px var(--g1);outline:none}
          .rf-site-footer a svg{fill:var(--ic);opacity:.9;transition:opacity .18s,fill .18s}
          .rf-site-footer a:hover svg{opacity:1}
          .rf-sep{flex:0 0 auto;width:1px;height:12px;background:var(--ln)}
          @media(max-width:600px){.rf-site-footer{gap:9px;padding:6px 11px;font-size:9px;letter-spacing:.06em;bottom:8px}.rf-site-footer a{gap:4px}}
          CSS

      - name: Inject head assets
        run: python3 scripts/inject.py

      - name: Generate OG image
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1200 -h 630 games/rhrf-bullseye/og-banner.svg -o games/rhrf-bullseye/.friendsdk/og.png
          python3 - <<'EOF'
          import glob
          out = "games/rhrf-bullseye/.friendsdk"
          base = "https://perpetuumcontinuum.github.io/RHRF_Bullseye"
          og = (
            '<meta property="og:type" content="website"/>'
            '<meta property="og:site_name" content="RHRF Bullseye"/>'
            '<meta property="og:title" content="RHRF Bullseye — Cyber Archery for Rare Friends"/>'
            '<meta property="og:description" content="Your Generations NFT becomes the archer. Shoot moving targets, dodge ghosts, deflect asteroids and unlock legendary gear. Built on FriendSDK v0.1.4, live on Robinhood Chain."/>'
            '<meta property="og:url" content="' + base + '/"/>'
            '<meta property="og:image" content="' + base + '/og.png"/>'
            '<meta property="og:image:type" content="image/png"/>'
            '<meta property="og:image:width" content="1200"/>'
            '<meta property="og:image:height" content="630"/>'
            '<meta name="twitter:card" content="summary_large_image"/>'
            '<meta name="twitter:title" content="RHRF Bullseye — Cyber Archery for Rare Friends"/>'
            '<meta name="twitter:description" content="Cyber archery minigame for the Rare Friends Vibeathon. Simulated RF, Robinhood Chain, FriendSDK v0.1.4."/>'
            '<meta name="twitter:image" content="' + base + '/og.png"/>'
          )
          for h in sorted(glob.glob(out + "/*.html")):
              t = open(h, encoding="utf-8").read()
              if "og:image" in t:
                  continue
              t = t.replace("</head>", og + "</head>", 1)
              open(h, "w", encoding="utf-8").write(t)
              print("og injected", h)
          EOF

      - name: Cache-bust asset URLs
        run: python3 scripts/cache_bust.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: games/rhrf-bullseye/.friendsdk

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
