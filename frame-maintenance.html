<div id="rfMaintenance" hidden aria-live="polite">
  <style>
    #rfMaintenance{
      position:fixed;
      inset:0;
      z-index:40;
      pointer-events:none;
      overflow:hidden;
    }
    #rfMaintenance[hidden]{display:none}
    #rfMaintenance .rf-tape{
      position:absolute;
      left:50%;
      top:50%;
      height:clamp(72px,30vh,240px);
      width:var(--tape-w,200vmax);
      transform:translate(-50%,-50%) rotate(var(--tape-a,-25deg));
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:repeating-linear-gradient(60deg,#f5c518 0 26px,#141414 26px 52px);
      border-top:3px solid #141414;
      border-bottom:3px solid #141414;
      box-shadow:0 0 30px rgba(0,0,0,.55);
    }
    #rfMaintenance .rf-tape span{
      white-space:nowrap;
      font:900 clamp(.8rem,2.2vh,1.4rem)/1 ui-monospace,monospace;
      letter-spacing:.15em;
      text-transform:uppercase;
      color:#fff;
      text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 0 6px #000;
    }
  </style>

  <div class="rf-tape" aria-hidden="true">
    <span>UNDER MAINTENANCE - WORK IN PROGRESS - SESSION PROGRESS AND NEW PURCHASES MAY BE LOST - UNDER MAINTENANCE - WORK IN PROGRESS - SESSION PROGRESS AND NEW PURCHASES MAY BE LOST - UNDER MAINTENANCE - WORK IN PROGRESS - SESSION PROGRESS AND NEW PURCHASES MAY BE LOST - </span>
  </div>

  <script>
    (function () {
      var el = document.getElementById("rfMaintenance");
      if (!el) return;

      var DEFAULT = false;
      var KEY = "rf_maintenance";
      var tape = el.querySelector(".rf-tape");

      function read() {
        try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; }
      }

      function layout() {
        if (!tape) return;
        var w = window.innerWidth, h = window.innerHeight;
        var a = Math.atan2(h, w) * 180 / Math.PI;
        tape.style.setProperty("--tape-a", (-a) + "deg");
        tape.style.setProperty("--tape-w", Math.ceil(Math.hypot(w, h)) + "px");
      }

      function set(v) {
        el.hidden = !v;
        if (v) layout();
        try {
          if (v) localStorage.setItem(KEY, "1");
          else localStorage.removeItem(KEY);
        } catch (e) {}
      }

      var q = new URLSearchParams(location.search);
      if (q.has("maintenance")) {
        var val = q.get("maintenance");
        set(val === "" || val === "1" || val === "true");
      } else if (DEFAULT) {
        set(true);
      } else {
        set(read());
      }

      addEventListener("resize", layout);
      addEventListener("orientationchange", layout);

      window.rfMaint = {
        on: function () { set(true); },
        off: function () { set(false); },
        toggle: function () { set(el.hidden); },
        get state() { return !el.hidden; }
      };
    })();
  </script>
</div>
